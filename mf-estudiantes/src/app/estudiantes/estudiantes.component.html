<section class="estudiantes">
  <h1 class="titulo">👨‍🎓 Estudiantes</h1>

  @if (mensajeSeleccion) {
    <p class="confirmacion" role="status">{{ mensajeSeleccion }}</p>
  }

  @if (cargando) {
    <p class="estado">Cargando estudiantes…</p>
  } @else if (error) {
    <p class="estado estado--error">{{ error }}</p>
  } @else {
    <ul class="rejilla">
      @for (est of estudiantes; track est.id) {
        <li>
          <button
            type="button"
            class="tarjeta"
            [class.tarjeta--seleccionada]="seleccionId === est.id"
            (click)="seleccionar(est)"
          >
            <div class="avatar" aria-hidden="true">{{ iniciales(est.nombre) }}</div>
            <div class="datos">
              <span class="nombre">{{ est.nombre }}</span>
              <span class="meta"><span class="etiqueta">Código:</span> {{ est.codigo }}</span>
              <span class="meta"><span class="etiqueta">Carrera:</span> {{ est.carrera }}</span>
              <span class="meta"><span class="etiqueta">Semestre:</span> {{ est.semestre }}º</span>
            </div>
          </button>
        </li>
      }
    </ul>
  }
</section>
