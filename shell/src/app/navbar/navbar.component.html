<nav class="pam-nav" aria-label="Navegación principal">
  <a class="pam-brand" routerLink="/estudiantes" aria-label="Inicio PAM">
    <lucide-icon name="layout-dashboard" [size]="18"></lucide-icon>
    <span class="pam-brand__mark">PAM</span>
    <span class="pam-brand__text">
      <strong>Plataforma Académica</strong>
      <small>Operación modular</small>
    </span>
  </a>
  <ul class="pam-links">
    @for (modulo of modulos; track modulo.ruta) {
      <li>
        <a
          class="nav-link"
          [routerLink]="modulo.ruta"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <span aria-hidden="true">{{ modulo.nombre.slice(0, 2).toUpperCase() }}</span>
          {{ modulo.nombre }}
          <span
            class="health-dot"
            [class.online]="getHealthEstado(modulo.id) === 'online'"
            [class.offline]="getHealthEstado(modulo.id) === 'offline'"
            [class.unknown]="getHealthEstado(modulo.id) === 'unknown'"
            [attr.aria-label]="'Estado ' + getHealthEstado(modulo.id)"
            [title]="getHealthEstado(modulo.id)"
          ></span>
        </a>
      </li>
    }
  </ul>
</nav>
