<nav class="pam-nav" aria-label="Navegación principal">
  <a class="pam-brand" routerLink="/estudiantes" aria-label="Inicio PAM">
    <lucide-icon name="graduation-cap" [size]="20" class="pam-brand__icon" aria-hidden="true"></lucide-icon>
    <span class="pam-brand__text">
      <strong>Plataforma Académica</strong>
      <small>UMSA</small>
    </span>
  </a>
  <ul class="pam-links">
    @for (modulo of modulos; track modulo.ruta) {
      <li>
        <a
          class="nav-link"
          [routerLink]="modulo.ruta"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <lucide-icon [name]="getModuloIcon(modulo.id)" [size]="16" aria-hidden="true"></lucide-icon>
          <span class="nav-link__label">{{ modulo.nombre }}</span>
          <span
            class="health-dot"
            [class.online]="getHealthEstado(modulo.id) === 'online'"
            [class.offline]="getHealthEstado(modulo.id) === 'offline'"
            [class.unknown]="getHealthEstado(modulo.id) === 'unknown'"
            [attr.aria-label]="'Estado del módulo: ' + getHealthEstado(modulo.id)"
            [title]="getHealthEstado(modulo.id)"
          ></span>
        </a>
      </li>
    }
  </ul>
</nav>
