<div class="console-wrapper">
  <div class="console-header">
    <div class="console-title">
      <lucide-icon name="activity" [size]="14"></lucide-icon>
      Consola arquitectónica
    </div>
    <button class="clear-btn" (click)="clearLogs()">Limpiar</button>
  </div>

  <div class="console-body" #logContainer>
    <div *ngIf="logs.length === 0" class="empty-state">
      Sin eventos registrados.
    </div>
    <div
      *ngFor="let log of logs; let i = index"
      class="log-entry"
      [class.log-recent]="i >= logs.length - 3">
      <span class="log-time">[{{ log.timestamp }}]</span>
      <span class="log-direction" [class.dir-emitido]="log.direction === 'emitido'"
                                   [class.dir-recibido]="log.direction === 'recibido'"
                                   [class.dir-error]="log.direction === 'error'">
        {{ log.direction }}
      </span>
      <span class="log-evento">{{ log.evento }}</span>
      <span class="log-arrow">→</span>
      <span class="log-resumen">{{ log.resumen }}</span>
    </div>
  </div>
</div>
