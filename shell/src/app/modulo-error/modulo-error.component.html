<div class="error-container">
  <div class="error-card">
    <lucide-icon name="alert-circle" [size]="32"></lucide-icon>
    <h3>Módulo no disponible</h3>
    <p>No se pudo conectar con el módulo remoto.</p>
    <p class="error-hint">
      El resto de la plataforma continúa funcionando normalmente.
    </p>

    <div *ngIf="retryFailed" class="retry-error">
      <lucide-icon name="x-circle" [size]="13"></lucide-icon>
      El módulo sigue sin responder. Verifica que el servidor esté activo.
    </div>

    <div class="error-actions">
      <button class="retry-btn" (click)="retry()" [disabled]="isRetrying">
        <lucide-icon name="refresh-cw" [size]="14"></lucide-icon>
        {{ isRetrying ? 'Verificando...' : 'Reconectar' }}
      </button>
      <button class="back-btn" (click)="goToEstudiantes()">
        Ir a Estudiantes
      </button>
    </div>

    <div class="error-console-note">
      <lucide-icon name="activity" [size]="12"></lucide-icon>
      El error ha sido registrado en la consola arquitectónica.
    </div>
  </div>
</div>
